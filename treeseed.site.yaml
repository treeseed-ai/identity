name: Identity
slug: identity
siteUrl: https://example.com
contactEmail: hello@example.com
projectRoot: ..
hosting:
  kind: hosted_project
  registration: optional
  marketBaseUrl: https://api.treeseed.dev
  teamId: identity
  projectId: identity
cloudflare:
  accountId: replace-with-cloudflare-account-id
  workerName: identity
  pages:
    projectName: identity
    previewProjectName: identity-staging
    productionBranch: main
    stagingBranch: staging
    buildOutputDir: dist
surfaces:
  web:
    enabled: true
    provider: cloudflare
    rootDir: .
    publicBaseUrl: https://identity.pages.dev
    localBaseUrl: http://127.0.0.1:4321
plugins:
  - package: '@treeseed/sdk/plugin-default'
providers:
  forms: store_only
  agents:
    execution: codex
    mutation: local_branch
    repository: git
    verification: local
    notification: sdk_message
    research: project_graph
  deploy: cloudflare
  content:
    runtime: team_scoped_r2_overlay
    publish: team_scoped_r2_overlay
    docs: default
  site: default
smtp:
  enabled: false
turnstile:
  enabled: false
